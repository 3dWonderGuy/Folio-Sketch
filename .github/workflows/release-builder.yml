name: Release Builder (Linux, Windows, Android)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or ref to build'
        required: true
        default: 'main'
        type: string
      tag_name:
        description: 'Release tag name (leave empty for auto-generated nightly-YYYYMMDD-HHMM or inspector-preview)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish artifacts to GitHub Release'
        required: false
        default: true
        type: boolean
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libudev-dev

      - name: Configure CMake (Linux)
        run: |
          cmake -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON

      - name: Build folio_ink_inspector (Linux)
        run: |
          cmake --build build-linux --config Release -j $(nproc)

      - name: Run Headless Geometry Diagnostics (Linux)
        run: |
          ./build-linux/folio_ink_inspector --diagnose

      - name: Package Linux Release Archive
        run: |
          mkdir -p dist/FolioInkInspector-Linux
          cp build-linux/folio_ink_inspector dist/FolioInkInspector-Linux/
          [ -f LICENSE ] && cp LICENSE dist/FolioInkInspector-Linux/
          [ -f README.md ] && cp README.md dist/FolioInkInspector-Linux/
          chmod +x dist/FolioInkInspector-Linux/folio_ink_inspector
          tar -czvf FolioInkInspector-Linux-x86_64.tar.gz -C dist/FolioInkInspector-Linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolioInkInspector-Linux-x86_64
          path: FolioInkInspector-Linux-x86_64.tar.gz
          retention-days: 14

  build-windows:
    name: Build Windows (MSVC / Ninja x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake (Windows)
        run: |
          cmake -B build-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON

      - name: Build folio_ink_inspector (Windows)
        run: |
          cmake --build build-win --config Release -j 4

      - name: Run Headless Geometry Diagnostics (Windows)
        shell: pwsh
        run: |
          $exe = if (Test-Path "build-win/folio_ink_inspector.exe") { "build-win/folio_ink_inspector.exe" }
                 else {
                   (Get-ChildItem -Path build-win -Recurse -Filter "folio_ink_inspector.exe" | Select-Object -First 1).FullName
                 }
          & $exe --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FolioInkInspector-Windows
          $exe = if (Test-Path "build-win/folio_ink_inspector.exe") { "build-win/folio_ink_inspector.exe" }
                 else {
                   (Get-ChildItem -Path build-win -Recurse -Filter "folio_ink_inspector.exe" | Select-Object -First 1).FullName
                 }
          if (-not $exe -or -not (Test-Path $exe)) {
            Write-Error "Could not find folio_ink_inspector.exe in build-win!"
            exit 1
          }
          Copy-Item -Path $exe -Destination "dist/FolioInkInspector-Windows/folio_ink_inspector.exe" -Force
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "dist/FolioInkInspector-Windows/" }
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "dist/FolioInkInspector-Windows/" }
          Compress-Archive -Path "dist/FolioInkInspector-Windows/*" -DestinationPath "FolioInkInspector-Windows-x86_64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolioInkInspector-Windows-x86_64
          path: FolioInkInspector-Windows-x86_64.zip
          retention-days: 14

  build-android:
    name: Build Android (ARM64-v8a APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install Android NDK & CMake
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.30.3" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        working-directory: src/android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Android APK
        shell: bash
        run: |
          APK_PATH=$(find src/android-project/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Could not find compiled APK!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" FolioInkInspector-Android-arm64-v8a.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolioInkInspector-Android-APK
          path: FolioInkInspector-Android-arm64-v8a.apk
          retention-days: 14

  publish-release:
    name: Publish Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-android]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Determine Release Tag & Commit Info
        id: release_meta
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHA=${SHA}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT

          INPUT_TAG="${{ inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # Default to a unique timestamped tag to prevent GitHub Ruleset/tag immutability collisions
            TAG_NAME="preview-$(date +'%Y%m%d-%H%M%S')"
          fi

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          mkdir -p release-artifacts

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: FolioInkInspector-Linux-x86_64
          path: release-artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FolioInkInspector-Windows-x86_64
          path: release-artifacts

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: FolioInkInspector-Android-APK
          path: release-artifacts

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.TAG_NAME }}
          target_commitish: ${{ steps.release_meta.outputs.SHA }}
          name: "Folio Ink Inspector Build (${{ steps.release_meta.outputs.TAG_NAME }})"
          body: |
            ## Folio-Sketch Inking Diagnostic Playground & Inspector
            - **Branch / Ref:** `${{ inputs.branch || github.ref_name }}`
            - **Commit:** ${{ steps.release_meta.outputs.SHA }}

            ### Included Multi-Platform Packages:
            - **Linux (x86_64):** `FolioInkInspector-Linux-x86_64.tar.gz`
            - **Windows (x64):** `FolioInkInspector-Windows-x86_64.zip`
            - **Android (ARM64-v8a):** `FolioInkInspector-Android-arm64-v8a.apk`
          prerelease: true
          make_latest: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
