name: Folio-Sketch CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. LINUX BUILD & REGRESSION TESTS (GCC x86_64)
  # =========================================================================
  test-linux:
    name: Linux Build & Tests (GCC x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libevdev-dev libx11-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxss-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libxtst-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOLIO_SKETCH_STANDALONE=ON \
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON \
            -DFOLIO_SKETCH_BUILD_TESTS=ON

      - name: Compile Targets
        run: |
          cmake --build build --config Release

      - name: Run Regression Tests
        run: |
          ./build/folio_sketch_tests

      - name: Run Headless Inspector Diagnostics
        run: |
          ./build/folio_ink_inspector --diagnose

  # =========================================================================
  # 2. WINDOWS BUILD & REGRESSION TESTS (MSVC x64)
  # =========================================================================
  test-windows:
    name: Windows Build & Tests (MSVC x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC & Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja ^
            -DCMAKE_C_COMPILER=cl.exe ^
            -DCMAKE_CXX_COMPILER=cl.exe ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DFOLIO_SKETCH_STANDALONE=ON ^
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON ^
            -DFOLIO_SKETCH_BUILD_TESTS=ON

      - name: Compile Targets
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release

      - name: Run Regression Tests
        shell: cmd
        run: |
          build\folio_sketch_tests.exe

      - name: Run Headless Inspector Diagnostics
        shell: cmd
        run: |
          build\folio_ink_inspector.exe --diagnose

  # =========================================================================
  # 3. ANDROID NATIVE NDK BUILD (arm64-v8a)
  # =========================================================================
  test-android:
    name: Android Native NDK Check (arm64-v8a)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure CMake for Android (arm64-v8a)
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOLIO_SKETCH_STANDALONE=ON \
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON \
            -DFOLIO_SKETCH_BUILD_TESTS=OFF \
            -DSDL_ANDROID_JAR=OFF

      - name: Compile Android Native Targets
        run: |
          cmake --build build-android --config Release

  # =========================================================================
  # 4. IOS STATIC LIBRARY BUILD (Xcode arm64)
  # =========================================================================
  test-ios:
    name: iOS Build Check (Xcode arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake for iOS
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DFOLIO_SKETCH_STANDALONE=ON \
            -DFOLIO_SKETCH_BUILD_INSPECTOR=OFF \
            -DFOLIO_SKETCH_BUILD_TESTS=OFF

      - name: Compile Core iOS Library
        run: |
          cmake --build build-ios --config Release --target FolioSketch
