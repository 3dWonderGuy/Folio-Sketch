name: Folio-Sketch Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. WINDOWS RELEASE (Windows EXE Launcher & Libs)
  # =========================================================================
  release-windows:
    name: Package Windows Release (EXE & Libs)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure and Build
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_C_COMPILER=cl.exe ^
            -DCMAKE_CXX_COMPILER=cl.exe ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DFOLIO_SKETCH_STANDALONE=ON ^
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON
          cmake --build build --config Release

      - name: Archive Windows Release Bundle
        shell: cmd
        run: |
          mkdir release-windows
          copy build\folio_ink_inspector.exe release-windows\FolioInkInspector.exe
          copy build\FolioSketch.lib release-windows\
          if exist build\*.dll copy build\*.dll release-windows\
          for /R build %%f in (*.dll) do copy "%%f" release-windows\
          powershell Compress-Archive -Path release-windows\* -DestinationPath FolioSketch-Windows-x64-${{ github.ref_name }}.zip

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-package
          path: FolioSketch-Windows-x64-${{ github.ref_name }}.zip

  # =========================================================================
  # 2. LINUX / FEDORA RELEASE (Binary Package / RPM)
  # =========================================================================
  release-linux:
    name: Package Linux / Fedora RPM & Tarball
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies & RPM Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential rpm \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libevdev-dev libx11-dev libxcursor-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxss-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libxtst-dev

      - name: Configure CMake & CPack
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOLIO_SKETCH_STANDALONE=ON \
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON

      - name: Build Targets
        run: |
          cmake --build build --config Release

      - name: Package Linux Binary Tarball
        run: |
          mkdir -p release-linux/bin release-linux/lib
          cp build/folio_ink_inspector release-linux/bin/
          cp build/libFolioSketch.a release-linux/lib/
          tar -czvf FolioSketch-Linux-x86_64-${{ github.ref_name }}.tar.gz -C release-linux .

      - name: Upload Linux Asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-package
          path: FolioSketch-Linux-x86_64-${{ github.ref_name }}.tar.gz

  # =========================================================================
  # 3. ANDROID RELEASE (NDK Native Binaries & Shared Lib)
  # =========================================================================
  release-android:
    name: Package Android Release (Native Binaries)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure CMake for Android (arm64-v8a)
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOLIO_SKETCH_STANDALONE=ON \
            -DFOLIO_SKETCH_BUILD_INSPECTOR=ON \
            -DSDL_ANDROID_JAR=OFF

      - name: Compile Android Release Targets
        run: |
          cmake --build build-android --config Release

      - name: Package Android Native Artifacts
        run: |
          mkdir -p release-android/arm64-v8a
          cp build-android/libFolioSketch.a release-android/arm64-v8a/
          cp build-android/libmain.so release-android/arm64-v8a/
          zip -r FolioSketch-Android-arm64-v8a-${{ github.ref_name }}.zip release-android/

      - name: Upload Android Asset
        uses: actions/upload-artifact@v4
        with:
          name: android-release-package
          path: FolioSketch-Android-arm64-v8a-${{ github.ref_name }}.zip

  # =========================================================================
  # 4. PUBLISH GITHUB RELEASE
  # =========================================================================
  publish:
    name: Publish Official GitHub Release
    needs: [release-windows, release-linux, release-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Packages
        uses: actions/download-artifact@v4
        with:
          path: dist-packages

      - name: Stage Release Assets
        run: |
          mkdir -p release-assets
          find dist-packages -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.rpm" \) -exec cp {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
